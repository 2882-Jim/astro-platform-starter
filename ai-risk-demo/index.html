<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can I use AI for this?</title>
<style>
  /* page layout */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #1a1a1a;
    background: #f6f7f9;
    line-height: 1.5;
  }
  header, main, nav, .note {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 16px;
  }
  header {
    padding-top: 16px;
    text-align: right;
  }
  h1 { font-size: 28px; }
  h2 { font-size: 18px; }
  .grey { color: #555; }
  button { font-size: 16px; cursor: pointer; }

  /* the coloured rating labels */
  .label {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
    color: white;
  }
  .medium       { background: #f2b100; color: black; } /* amber */
  .high         { background: #c43e00; }              /* orange */
  .significant  { background: #b71c1c; }              /* red */
  .notpermitted { background: #424242; }              /* dark grey */

  /* white boxes (key, cards, log entries) */
  .box {
    background: white;
    border: 1px solid #d6d6d6;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
  }

  /* buttons */
  .big {
    background: #1f4e79;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 14px 40px;
    font-size: 20px;
  }
  .small-btn {
    background: white;
    color: #1f4e79;
    border: 1px solid #1f4e79;
    border-radius: 6px;
    padding: 6px 14px;
  }
  .section-btn {
    display: block;
    width: 100%;
    background: white;
    border: 1px solid #d6d6d6;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 8px;
    text-align: left;
    font-weight: bold;
  }
  .example {
    background: #f6f7f9;
    padding: 4px 12px;
    margin-top: 10px;
  }

  /* the mistake form */
  textarea {
    width: 100%;
    height: 70px;
    box-sizing: border-box;
    font-size: 16px;
    margin-bottom: 10px;
  }
  .warning {
    background: #fff4d6;
    border-left: 4px solid #f2b100;
    padding: 8px 12px;
  }

  /* Back / Home / Next bar */
  nav {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 24px;
    padding-top: 12px;
    padding-bottom: 12px;
    border-top: 1px solid #d6d6d6;
  }
  nav button {
    background: #1f4e79;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 12px;
  }
  nav button:disabled { background: #bbbbbb; }
  #position { flex: 1; text-align: center; color: #555; }
  .note { color: #555; font-size: 14px; padding-bottom: 24px; }
</style>
</head>
<body>

<header>
  <button class="small-btn" onclick="showPage('report')">Report an AI mistake</button>
</header>

<!-- this message only shows if there's a typo in the script and it can't run -->
<main id="page">
  <p>The page didn't load. There's probably a typo in the task list (often a missing comma,
  or a " inside the text). Undo your last change and refresh.</p>
</main>

<nav>
  <button id="back" onclick="goBack()">Back</button>
  <button onclick="showPage(0)">Home</button>
  <span id="position"></span>
  <button id="next" onclick="goNext()">Next</button>
</nav>

<p class="note">Prototype only: example tasks and draft ratings. No client data.</p>

<script>
// ============================================================
// THE TASK LIST - edit tasks here, one line per task
// section = must be one of the names in the sections list below (same spelling)
// rating  = "Medium", "High", "Significant" or "Not permitted"
// task    = the card title
// reason  = the one-line reason
// example = the text shown when you click "See more"
// every line ends with a comma. use ' not " inside the text, and no < or >
// ============================================================
var tasks = [
  { section: "Planning", rating: "Medium", task: "Brainstorm risks to consider for a client in an unfamiliar industry", reason: "Ideas can steer your risk assessment, so check each one before you use it.", example: "Ask for common risks in, say, a small housebuilder, without naming the client. Check each idea before it shapes your risk assessment." },
  { section: "Planning", rating: "Medium", task: "Summarise board minutes into a planning note", reason: "Goes on file, so every point must be checked back to the minutes.", example: "Ask for a bullet summary with page numbers. Tick every bullet against the minutes, then read the minutes yourself to check nothing important is missing." },
  { section: "Planning", rating: "Medium", task: "Draft the team briefing from your planning notes", reason: "Goes on file; check every point against the planning file.", example: "Give it your own planning notes and ask for a one-page briefing. Check each point against the file before you share it." },

  { section: "Walkthroughs and controls", rating: "Medium", task: "Draft questions to ask in a walkthrough meeting", reason: "Goes on file with your walkthrough; check each question fits the process.", example: "Describe the process in general terms and ask for questions covering each step. Edit the list to fit what you know about the client." },
  { section: "Walkthroughs and controls", rating: "Medium", task: "Turn your walkthrough notes into a tidy process write-up", reason: "Goes on file; every step must match your notes and the client's documents.", example: "Give it your own notes and ask for a step-by-step write-up. Check each step against your notes and documents, and delete anything you didn't see." },
  { section: "Walkthroughs and controls", rating: "Not permitted", task: "Record a client meeting with an AI note-taker without telling them", reason: "Recording people without their knowledge is against firm policy.", example: "Don't do this. Ask the client first and use only a firm-approved note-taker. If they say no, take your own notes." },

  { section: "Revenue", rating: "Medium", task: "Explain a revenue recognition term you're unsure about", reason: "If you use the answer in your work, check it against the standard first.", example: "Ask for a plain-English explanation with a simple example. Check it against the accounting standard or firm guidance before you rely on it." },
  { section: "Revenue", rating: "Significant", task: "Summarise a client's sales contract", reason: "A confidential document, and a missed clause could be hard to spot.", example: "Use local AI only. Read the contract yourself for key terms such as returns, rebates and when control passes, and check every point in the summary." },
  { section: "Revenue", rating: "Medium", task: "Draft a blank template for sales cut-off testing", reason: "The template goes on file; check the columns cover what the test needs.", example: "Ask for column headings such as invoice number, dispatch date and period recorded. Adapt it to the firm's working paper format." },

  { section: "Purchases", rating: "Medium", task: "Draft a list of documents to request from the client", reason: "Goes on file; check it before it's sent.", example: "Ask for a list of typical purchase documents (orders, delivery notes, invoices). Tailor it to the client and remove anything you don't need." },
  { section: "Purchases", rating: "High", task: "Copy figures from scanned purchase invoices into a testing schedule", reason: "The testing relies on these figures, so every one is checked and signed off.", example: "Ask it to read the scanned invoices into a table. Check every date, amount and supplier to the invoice, then have your reviewer sign it off." },
  { section: "Purchases", rating: "Significant", task: "Use AI to search for unrecorded liabilities", reason: "A missed item would be hard to spot and could change the conclusion.", example: "Use local AI only, alongside your usual review of payments and invoices after the year end, and record what it was asked to do." },

  { section: "Payroll", rating: "Medium", task: "Draft an email asking the client for payroll reports", reason: "Goes on file; check it before sending.", example: "Ask for a clear, polite email listing the reports you need. Leave out names and salaries: the AI doesn't need them." },
  { section: "Payroll", rating: "Significant", task: "Use AI to flag employees with unusual pay", reason: "It affects named people, and mistakes would be hard to spot.", example: "Use local AI only. Treat each flag as a question, not a finding: check it to payroll records and discuss it with the client first." },
  { section: "Payroll", rating: "Not permitted", task: "Paste the client's payroll file into a personal chatbot", reason: "Client and personal data in a personal AI account breaks firm policy.", example: "Don't do this. Use only the firm's approved tools for client data. If you're not sure a tool is approved, ask your manager." },

  { section: "Cash and bank", rating: "Medium", task: "List reasons a bank reconciliation might not agree", reason: "Check each reason against the actual reconciliation before using it.", example: "Ask for common causes (timing differences, bank charges, errors). Use them as ideas when you follow up differences with the client." },
  { section: "Cash and bank", rating: "High", task: "List year-end balances from bank statements in a schedule", reason: "The audit relies on these balances, so every one is checked and signed off.", example: "Ask it to read the statements into a table. Check every balance to the statement and bank confirmation, then have it signed off." },
  { section: "Cash and bank", rating: "Not permitted", task: "Use AI to make up a bank confirmation that hasn't arrived", reason: "Making up evidence is never allowed; the file would be false.", example: "Don't do this. Chase the bank, tell your manager, and agree with them what other work to do." },

  { section: "Related parties", rating: "Medium", task: "List the kinds of related parties to ask the directors about", reason: "Goes on file with your enquiries; check the list fits the client.", example: "Ask for typical examples (close family, companies the directors control, key managers). Use them to plan your questions." },
  { section: "Related parties", rating: "Medium", task: "Summarise public records of the directors' other companies", reason: "Goes on file; every company and date must be checked to the public record.", example: "Give it the Companies House records you've downloaded. Check every name, role and date, and check no company has been left out." },
  { section: "Related parties", rating: "Significant", task: "Use AI to scan the ledgers for related-party transactions", reason: "If it misses one you're unlikely to notice, and the disclosures could be wrong.", example: "Use local AI only. Give it the full list of known related parties, record what it searched, and still do your usual enquiries." },

  { section: "Accounts and disclosures", rating: "Medium", task: "Spot typos and formatting slips in the draft accounts", reason: "Check every suggested change before it goes into the accounts.", example: "Ask it to point out spelling, layout and numbering slips. Make the fixes yourself, and don't let it change figures or policy wording." },
  { section: "Accounts and disclosures", rating: "High", task: "Check that figures in the notes agree to the main statements", reason: "The accounts rely on this, so every pair is checked and signed off.", example: "Ask it to list each note figure next to the statement figure. Check every pair yourself, follow up differences, and get it signed off." },
  { section: "Accounts and disclosures", rating: "Significant", task: "Use AI to help evaluate management's going concern assessment", reason: "A key conclusion; a confident wrong answer would be hard to spot.", example: "Use local AI only, to challenge your own work. Management makes the assessment; the team evaluates it and reaches its own conclusion." },

  { section: "Completion and reporting", rating: "Medium", task: "Tidy the wording of your replies to review points", reason: "Goes on file; check it hasn't changed what you're saying.", example: "Ask it to make your reply clearer and shorter. Check the facts are unchanged before you post it." },
  { section: "Completion and reporting", rating: "High", task: "Draft a completion summary from the working papers", reason: "The partner relies on it, so every point is checked and signed off.", example: "Ask for a draft listing key findings with working paper references. Check every point and reference, add anything missed, and get it signed off." },
  { section: "Completion and reporting", rating: "Not permitted", task: "Let AI write the audit report and sign it off unchecked", reason: "The opinion is the auditor's own judgement and can't be handed to AI.", example: "Don't do this. The report comes from the firm's standard wording and is reviewed and signed by the partner responsible." },
];

// THE RATINGS - colour, what it means and what to do
var ratings = {
  "Medium":        { colour: "medium",       meaning: "Goes on file, but every item is checked to source.", todo: "Check every item, and tell your reviewer you used AI." },
  "High":          { colour: "high",         meaning: "Relied on, so every item is checked to source and signed off.", todo: "Check every item, and have your reviewer sign it off before anyone relies on it." },
  "Significant":   { colour: "significant",  meaning: "Could affect a conclusion, would be hard to spot, or affects a person.", todo: "Only on firm-approved local AI on your laptop, with every item checked and reviewed." },
  "Not permitted": { colour: "notpermitted", meaning: "Against firm policy, e.g. client data in a personal AI account.", todo: "Don't." }
};

// THE SECTIONS, in order
var sections = ["Planning", "Walkthroughs and controls", "Revenue", "Purchases", "Payroll",
                "Cash and bank", "Related parties", "Accounts and disclosures", "Completion and reporting"];

// check for spelling mistakes in the task list
for (var i = 0; i < tasks.length; i++) {
  if (sections.indexOf(tasks[i].section) == -1 || ratings[tasks[i].rating] == undefined) {
    alert("Check the section and rating spelling for: " + tasks[i].task);
  }
}

// ============================================================
// THE PAGES
// page 0 = home, page 1 = list of sections, pages 2 to 10 = each section
// "report" = the mistake form, "log" = the mistake log
// ============================================================
var currentPage = 0;
var lastNumberedPage = 0; // so Back works from the report and log pages
var lastPage = sections.length + 1;

function showPage(p) {
  currentPage = p;
  var html = "";
  var position = "";

  if (p == 0) {
    html = homePage();
    position = "Home";
  } else if (p == 1) {
    html = sectionsPage();
    position = "All sections";
  } else if (p == "report") {
    html = reportPage();
    position = "Report a mistake";
  } else if (p == "log") {
    html = logPage();
    position = "Mistake log";
  } else {
    html = sectionPage(p - 2);
    position = "Section " + (p - 1) + " of " + sections.length;
  }

  if (p != "report" && p != "log") {
    lastNumberedPage = p;
  }

  document.getElementById("page").innerHTML = html;
  document.getElementById("position").innerHTML = position;

  // grey out Back on the home page and Next on the last page (and the report/log pages)
  document.getElementById("back").disabled = (p == 0);
  document.getElementById("next").disabled = (p == lastPage || p == "report" || p == "log");

  window.scrollTo(0, 0);
}

function goBack() {
  if (currentPage == "report" || currentPage == "log") {
    showPage(lastNumberedPage);
  } else {
    showPage(currentPage - 1);
  }
}

function goNext() {
  showPage(currentPage + 1);
}

// makes a coloured label, e.g. makeLabel("High")
function makeLabel(name) {
  return '<span class="label ' + ratings[name].colour + '">' + name + '</span>';
}

// home page
function homePage() {
  var html = "<h1>Can I use AI for this?</h1>";
  html += '<p class="grey">See which uses of AI in an audit are fine and which are risky, and what to do about each.</p>';
  html += "<h2>The four ratings</h2>";
  for (var name in ratings) {
    html += '<div class="box">' + makeLabel(name) + "<br>" + ratings[name].meaning;
    html += "<br><b>What to do:</b> " + ratings[name].todo + "</div>";
  }
  html += '<button class="big" onclick="showPage(1)">Start</button>';
  return html;
}

// list of sections
function sectionsPage() {
  var html = "<h1>Choose an audit area</h1>";
  for (var i = 0; i < sections.length; i++) {
    html += '<button class="section-btn" onclick="showPage(' + (i + 2) + ')">' + sections[i] + "</button>";
  }
  return html;
}

// one section with its task cards
function sectionPage(number) {
  var name = sections[number];
  var html = "<h1>" + name + "</h1>";
  html += '<p class="grey">Example tasks. Click "See more" to see what good AI use looks like.</p>';
  for (var i = 0; i < tasks.length; i++) {
    var t = tasks[i];
    if (t.section == name) {
      html += '<div class="box">';
      html += "<h2>" + t.task + "</h2>";
      html += makeLabel(t.rating);
      html += "<p>" + t.reason + "</p>";
      html += '<button class="small-btn" onclick="seeMore(' + i + ')">See more</button>';
      html += '<div class="example" id="more' + i + '" style="display:none">';
      html += "<p><b>Good AI use looks like:</b> " + t.example + "</p>";
      html += "<p><b>What to do:</b> " + ratings[t.rating].todo + "</p>";
      html += "</div></div>";
    }
  }
  return html;
}

// opens or closes the example under a card
function seeMore(i) {
  var box = document.getElementById("more" + i);
  if (box.style.display == "none") {
    box.style.display = "block";
  } else {
    box.style.display = "none";
  }
}

// ============================================================
// THE AI MISTAKE LOG (saved in this browser only)
// ============================================================
function reportPage() {
  var html = "<h1>Report an AI mistake</h1>";
  html += '<p class="warning">No client names or data. Describe the mistake, not the client.</p>';
  html += "<p><b>What went wrong?</b></p><textarea id='wrong'></textarea>";
  html += "<p><b>How was it caught?</b></p><textarea id='caught'></textarea>";
  html += "<p><b>What could have happened?</b></p><textarea id='impact'></textarea>";
  html += '<button class="big" onclick="saveMistake()">Save</button> ';
  html += '<button class="small-btn" onclick="showPage(\'log\')">See the log</button>';
  return html;
}

function saveMistake() {
  var wrong = document.getElementById("wrong").value;
  var caught = document.getElementById("caught").value;
  var impact = document.getElementById("impact").value;
  if (wrong == "") {
    alert("Please say what went wrong.");
    return;
  }
  var today = new Date().toLocaleDateString("en-GB");
  var log = loadLog();
  log.unshift({ date: today, wrong: wrong, caught: caught, impact: impact }); // unshift puts it at the top
  localStorage.setItem("mistakeLog", JSON.stringify(log));
  showPage("log");
}

function loadLog() {
  var saved = localStorage.getItem("mistakeLog");
  if (saved == null) {
    return [];
  }
  return JSON.parse(saved);
}

function logPage() {
  var log = loadLog();
  var html = "<h1>AI mistake log</h1>";
  html += '<p class="grey">Newest first. Saved in this browser only.</p>';
  html += '<button class="small-btn" onclick="showPage(\'report\')">Report a mistake</button> ';
  html += '<button class="small-btn" onclick="clearLog()">Clear all</button>';
  if (log.length == 0) {
    html += "<p>No mistakes logged yet.</p>";
  }
  for (var i = 0; i < log.length; i++) {
    html += '<div class="box"><p class="grey">' + log[i].date + "</p>";
    html += "<p><b>What went wrong:</b> " + clean(log[i].wrong) + "</p>";
    html += "<p><b>How it was caught:</b> " + clean(log[i].caught) + "</p>";
    html += "<p><b>What could have happened:</b> " + clean(log[i].impact) + "</p></div>";
  }
  return html;
}

function clearLog() {
  if (confirm("Delete every entry in the log?")) {
    localStorage.removeItem("mistakeLog");
    showPage("log");
  }
}

// stops typed < and > signs messing up the page
function clean(text) {
  return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// start on the home page
showPage(0);
</script>
</body>
</html>
